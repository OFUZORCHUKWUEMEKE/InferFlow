apiVersion: apps/v1
kind: Deployment
metadata:
  name: inferflow
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inferflow
  template:
    metadata:
      labels:
        app: inferflow
    spec:
      containers:
        - name: inferflow
          image: inferflow:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
